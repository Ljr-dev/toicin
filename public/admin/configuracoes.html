<body>
  <aside class="sidebar">
    <h2>Painel</h2>

  <main class="admin-main"><h1>Configurações da loja</h1><form id="settingsForm" class="form-grid"></form><section class="faq-admin"><div class="topline"><h2>Perguntas frequentes</h2><button id="addFaq" class="admin-btn" type="button">Adicionar pergunta</button></div><div id="faqList"></div></section><section class="faq-admin"><div class="topline"><h2>Senha do painel</h2></div><form id="passwordForm" class="form-grid"><label>Senha atual<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>Nova senha<input name="newPassword" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirmar nova senha<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="admin-btn form-submit">Alterar senha</button></form><p id="passwordMessage"></p></section><p id="message"></p></main>
