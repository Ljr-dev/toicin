<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorias</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/css/admin.css"></head>
<body>
  <aside class="sidebar">
    <h2>Painel</h2>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/novo-produto.html">Novo produto</a>
    <a href="/admin/configuracoes.html">Configurações</a>
    <a href="/" target="_blank" rel="noopener">Ver loja</a>
    <button id="logout">Sair</button>
  </aside>
  <main class="admin-main">
    <h1>Categorias</h1>
    <p class="hint">As categorias aparecem no menu da loja e no filtro do catálogo.</p>

    <form id="categoryForm" class="inline-form">
      <input name="name" placeholder="Nome da nova categoria" maxlength="60" required>
      <button class="admin-btn">Adicionar</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>Slug</th><th>Produtos</th><th>Ações</th></tr></thead>
        <tbody id="categoriesTable"></tbody>
      </table>
    </div>
    <p id="message"></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/categorias-admin.js"></script>
</body>
</html>
