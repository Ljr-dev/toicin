# Copie para /etc/nginx/sites-available/<nome> e ajuste dominio e porta.
# Depois: ln -s /etc/nginx/sites-available/<nome> /etc/nginx/sites-enabled/<nome>
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d <dominio>

server {
    listen 80;
    listen [::]:80;
    server_name SEU-SUBDOMINIO.exemplo.com.br;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
